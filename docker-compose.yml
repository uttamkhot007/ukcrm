version: "3.8"

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_SUPABASE_URL: "" # No longer needed
        VITE_SUPABASE_PUBLISHABLE_KEY: "" # No longer needed
        VITE_SUPABASE_PROJECT_ID: "" # No longer needed
    ports:
      - "8080:8080"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - VITE_API_URL=http://localhost:3001
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - backend/.env
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=nexuscrm
      - DB_USER=nexuscrm
      - DB_PASSWORD=nexuscrm_dev
      - DB_SSL=false
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: nexuscrm
      POSTGRES_USER: nexuscrm
      POSTGRES_PASSWORD: nexuscrm_dev
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexuscrm"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
