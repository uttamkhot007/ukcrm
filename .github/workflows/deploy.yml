name: Deploy NexusCRM to AWS ECS Fargate

# ──────────────────────────────────────────────────────────────────────
# Triggered on push to main. Builds frontend + backend Docker images,
# pushes to ECR, runs DB migrations, force-deploys ECS services.
#
# Prerequisites (one-time setup in your AWS account):
#   1. CloudFormation stack deployed:  bash infra/deploy.sh
#   2. IAM role for GitHub OIDC trust   (see runbook DEPLOYMENT.md)
#   3. Repository secrets set:
#        AWS_DEPLOY_ROLE_ARN  — arn:aws:iam::<acct>:role/GitHubDeployRole
#        AWS_REGION           — ap-south-1
#        ENV_NAME             — production
# ──────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write   # OIDC
  contents: read

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ENV_NAME: ${{ secrets.ENV_NAME }}
  STACK_NAME: ${{ secrets.ENV_NAME }}-nexuscrm

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Read CloudFormation outputs
        id: cfn
        run: |
          OUT() { aws cloudformation describe-stacks --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" --output text; }
          echo "frontend_ecr=$(OUT FrontendECRUri)"     >> $GITHUB_OUTPUT
          echo "backend_ecr=$(OUT BackendECRUri)"       >> $GITHUB_OUTPUT
          echo "alb_dns=$(OUT ALBDNS)"                  >> $GITHUB_OUTPUT
          echo "cluster=${ENV_NAME}-nexuscrm"           >> $GITHUB_OUTPUT

      # The Dockerfile already runs `verify-aws-bundle.mjs` inside the build
      # stage, so an unclean bundle (any supabase.co, @supabase/supabase-js,
      # or "lovable" reference) fails this step before the image is pushed.
      - name: Build & push frontend
        run: |
          docker build \
            --build-arg VITE_API_URL="https://${{ steps.cfn.outputs.alb_dns }}" \
            --build-arg GIT_COMMIT_SHA="${{ github.sha }}" \
            --build-arg APP_RELEASE_ID="${{ github.sha }}" \
            --build-arg APP_ENVIRONMENT="production" \
            -t ${{ steps.cfn.outputs.frontend_ecr }}:${{ github.sha }} \
            -t ${{ steps.cfn.outputs.frontend_ecr }}:latest .
          docker push ${{ steps.cfn.outputs.frontend_ecr }}:${{ github.sha }}
          docker push ${{ steps.cfn.outputs.frontend_ecr }}:latest

      - name: Build & push backend
        run: |
          docker build \
            -t ${{ steps.cfn.outputs.backend_ecr }}:${{ github.sha }} \
            -t ${{ steps.cfn.outputs.backend_ecr }}:latest ./backend
          docker push ${{ steps.cfn.outputs.backend_ecr }}:${{ github.sha }}
          docker push ${{ steps.cfn.outputs.backend_ecr }}:latest

      # Never deploy the mutable :latest tag. Reusing the same task definition
      # lets a rolling deployment briefly (or, after a failed pull, permanently)
      # mix old and new containers behind the load balancer. Registering a new
      # revision with the commit-addressed image makes the release atomic and
      # gives ECS an exact version to roll back to.
      - name: Register immutable task definitions
        id: tasks
        run: |
          register_revision() {
            FAMILY="$1"
            CONTAINER="$2"
            IMAGE="$3"
            OUTPUT="$4"

            aws ecs describe-task-definition --task-definition "$FAMILY" \
              --query taskDefinition > "/tmp/${CONTAINER}-task.json"
            jq --arg image "$IMAGE" --arg container "$CONTAINER" \
              '.containerDefinitions |= map(if .name == $container then .image = $image else . end)
               | del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
                     .compatibilities, .registeredAt, .registeredBy)' \
              "/tmp/${CONTAINER}-task.json" > "/tmp/${CONTAINER}-task-next.json"
            TASK_ARN=$(aws ecs register-task-definition \
              --cli-input-json "file:///tmp/${CONTAINER}-task-next.json" \
              --query 'taskDefinition.taskDefinitionArn' --output text)
            echo "${OUTPUT}=${TASK_ARN}" >> "$GITHUB_OUTPUT"
          }

          register_revision \
            "${ENV_NAME}-nexuscrm-frontend" frontend \
            "${{ steps.cfn.outputs.frontend_ecr }}:${{ github.sha }}" frontend_task
          register_revision \
            "${ENV_NAME}-nexuscrm-backend" backend \
            "${{ steps.cfn.outputs.backend_ecr }}:${{ github.sha }}" backend_task

      - name: Run DB migrations (one-shot ECS task)
        run: |
          aws ecs run-task \
            --cluster ${{ steps.cfn.outputs.cluster }} \
            --task-definition '${{ steps.tasks.outputs.backend_task }}' \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[$(aws cloudformation describe-stacks --stack-name $STACK_NAME --query "Stacks[0].Outputs[?OutputKey=='PrivateSubnets'].OutputValue" --output text)],assignPublicIp=DISABLED}" \
            --overrides '{"containerOverrides":[{"name":"backend","command":["node","dist/db/migrate.js"]}]}' \
            --started-by "gha-${{ github.run_id }}"

      - name: Deploy immutable task revisions
        run: |
          aws ecs update-service --cluster ${{ steps.cfn.outputs.cluster }} \
            --service ${ENV_NAME}-frontend \
            --task-definition '${{ steps.tasks.outputs.frontend_task }}' > /dev/null
          aws ecs update-service --cluster ${{ steps.cfn.outputs.cluster }} \
            --service ${ENV_NAME}-backend \
            --task-definition '${{ steps.tasks.outputs.backend_task }}' > /dev/null

      - name: Wait for services to stabilize
        run: |
          aws ecs wait services-stable \
            --cluster ${{ steps.cfn.outputs.cluster }} \
            --services ${ENV_NAME}-frontend ${ENV_NAME}-backend

      - name: Verify deployed images
        run: |
          verify_service_image() {
            SERVICE="$1"
            CONTAINER="$2"
            EXPECTED_IMAGE="$3"

            TASK_ARNS=$(aws ecs list-tasks \
              --cluster "${{ steps.cfn.outputs.cluster }}" \
              --service-name "$SERVICE" \
              --desired-status RUNNING \
              --query 'taskArns' --output text)
            if [ -z "$TASK_ARNS" ] || [ "$TASK_ARNS" = "None" ]; then
              echo "No running tasks found for $SERVICE" >&2
              exit 1
            fi

            ACTUAL_IMAGES=$(aws ecs describe-tasks \
              --cluster "${{ steps.cfn.outputs.cluster }}" \
              --tasks $TASK_ARNS \
              --query "tasks[].containers[?name=='${CONTAINER}'].image" \
              --output text)
            for IMAGE in $ACTUAL_IMAGES; do
              if [ "$IMAGE" != "$EXPECTED_IMAGE" ]; then
                echo "$SERVICE rolled back or is mixed: expected $EXPECTED_IMAGE, found $IMAGE" >&2
                exit 1
              fi
            done
          }

          verify_service_image \
            "${ENV_NAME}-frontend" frontend \
            "${{ steps.cfn.outputs.frontend_ecr }}:${{ github.sha }}"
          verify_service_image \
            "${ENV_NAME}-backend" backend \
            "${{ steps.cfn.outputs.backend_ecr }}:${{ github.sha }}"

      - name: Verify deployed release manifest
        run: |
          ORIGIN="https://${{ steps.cfn.outputs.alb_dns }}"
          curl --fail --silent --show-error --retry 4 --retry-all-errors \
            -D /tmp/release-headers.txt \
            "${ORIGIN}/release-manifest.json?deploy-probe=${{ github.run_id }}" \
            -o /tmp/release-manifest.json
          jq -e --arg expected "${{ github.sha }}" \
            '.commit == $expected and .releaseId == $expected and .environment == "production"
             and .approvedDesignId == "platform-console-2026-08-23-r5"
             and .approvedDesignRevision == 4' \
            /tmp/release-manifest.json > /dev/null
          grep -qi '^cache-control:.*no-store' /tmp/release-headers.txt || {
            echo "release-manifest.json is cacheable" >&2
            exit 1
          }

      - name: Summary
        run: |
          echo "✅ Deployed commit ${{ github.sha }}"
          echo "🌐 https://${{ steps.cfn.outputs.alb_dns }}"
