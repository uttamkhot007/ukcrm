<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>NexusCRM - AI-Powered Business Management Platform</title>
    <meta name="description" content="Comprehensive AI-enabled CRM with Sales, Finance, HR, Technical, Marketing, and Employee Management modules. Streamline your business operations." />
    <meta name="author" content="NexusCRM" />

    <!--
      Cache-Control: prevent the HTML shell from ever being cached.
      Ensures admin routes always fetch the latest JS bundle from the network.
    -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <!-- Build identity (also surfaced by BuildVersionBadge after React mounts). -->
    <meta name="build-time" content="__INDEX_HTML_BUILT__" />

    <script>
      (function () {
        try {
          var buildTime = document.querySelector('meta[name="build-time"]')?.getAttribute("content") || String(Date.now());
          window.__BUILD_TIME__ = buildTime;

          function hardUrl(reason) {
            var next = new URL(window.location.href);
            next.searchParams.set("fresh", String(Date.now()));
            next.searchParams.set(reason || "build", buildTime);
            return next.toString();
          }

          function waitForActivation(reg) {
            return new Promise(function (resolve) {
              var worker = reg && (reg.installing || reg.waiting || reg.active);
              if (!worker || worker.state === "activated") return resolve();
              var done = false;
              var timer = setTimeout(function () { if (!done) { done = true; resolve(); } }, 5000);
              worker.addEventListener("statechange", function () {
                if (done || worker.state !== "activated") return;
                done = true;
                clearTimeout(timer);
                resolve();
              });
            });
          }

          window.__NEXUS_HARD_RELOAD_LATEST__ = function () {
            window.location.replace(hardUrl("hardReload"));
          };

          window.addEventListener("message", function (event) {
            var data = event && event.data;
            var type = data && typeof data === "object" ? (data.type || data.kind) : null;
            if (type === "NEXUS_BUILD_CHANGED" || type === "LOVABLE_BUILD_CHANGED" || type === "NEXUS_HARD_RELOAD_LATEST") {
              window.location.replace(hardUrl("iframeBuild"));
            }
          });

          if ("serviceWorker" in navigator) {
            navigator.serviceWorker
              .register("/sw.js?v=" + encodeURIComponent(buildTime))
              .then(waitForActivation)
              .then(function () {
                try {
                  if (sessionStorage.getItem("cache-killer:head-reloaded") === buildTime) return;
                  sessionStorage.setItem("cache-killer:head-reloaded", buildTime);
                } catch (e) { /* ignore */ }
                if (!new URL(window.location.href).searchParams.has("fresh")) {
                  window.location.replace(hardUrl("swActivated"));
                }
              })
              .catch(function () { /* ignore */ });
          }
        } catch (e) { /* never block app startup */ }
      })();
    </script>

    <meta name="theme-color" content="#6366f1" />

    <!-- Mobile Optimization -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="HandheldFriendly" content="true" />

    <meta property="og:title" content="NexusCRM - AI-Powered Business Management" />
    <meta property="og:description" content="Comprehensive AI-enabled CRM with Sales, Finance, HR, Technical, Marketing, and Employee Management modules." />
    <meta property="og:type" content="website" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@NexusCRM" />
  </head>

  <body class="dark">
    <!--
      ============================================================
      INLINE CACHE-KILLER (runs before any bundle code).
      ============================================================
      This script runs on every page load, BEFORE the JS bundle is
      executed. It exists because the only way to recover from a
      browser that's stuck on an old service worker + cached bundle
      is to clean up at the HTML level — the React code can't help
      if it's the thing being cached.

       Flow:
        1. Unregister every service-worker registration we find.
        2. Delete every entry in the Cache Storage API.
        3. Re-register /sw.js with a cache-busting query so the
           browser is FORCED to download the new self-destruct SW.
        4. Wait until that new SW reaches `activated` before reload.
        5. If we actually killed something AND the URL doesn't
           already carry ?fresh=, do exactly ONE hard reload so the
           next request bypasses any in-flight HTML cache.
        6. Listen for preview/build refresh postMessages and hard reload
           with a cache-busting query when requested by the iframe host.
    -->
    <script>
      (function () {
        try {
          var FRESH_PARAM = "fresh";
          var url = new URL(window.location.href);
          var alreadyFresh = url.searchParams.has(FRESH_PARAM);
          var didCleanup = false;

          // Mark when this exact HTML payload was served (used by the static badge).
          window.__BUILD_TIME__ =
            document
              .querySelector('meta[name="build-time"]')
              ?.getAttribute("content") || "unknown";

          function withFreshUrl(extraParam) {
            var freshUrl = new URL(window.location.href);
            freshUrl.searchParams.set(FRESH_PARAM, String(Date.now()));
            if (extraParam) freshUrl.searchParams.set(extraParam, window.__BUILD_TIME__ || String(Date.now()));
            return freshUrl.toString();
          }

          function reloadFresh(extraParam) {
            // Guard: only ever do ONE auto-reload per session, otherwise we
            // risk an infinite loop if the cleanup keeps "finding" things.
            try {
              var key = extraParam ? "cache-killer:manual-reloaded" : "cache-killer:reloaded";
              if (!extraParam && sessionStorage.getItem(key) === "1") return;
              sessionStorage.setItem(key, String(Date.now()));
            } catch (e) { /* ignore */ }
            window.location.replace(withFreshUrl(extraParam));
          }

          function waitForActivation(reg) {
            return new Promise(function (resolve) {
              var worker = reg && (reg.installing || reg.waiting || reg.active);
              if (!worker) return resolve();
              if (worker.state === "activated") return resolve();
              var done = false;
              var timeout = setTimeout(function () {
                if (done) return;
                done = true;
                resolve();
              }, 5000);
              worker.addEventListener("statechange", function () {
                if (done || worker.state !== "activated") return;
                done = true;
                clearTimeout(timeout);
                resolve();
              });
            });
          }

          window.__NEXUS_HARD_RELOAD_LATEST__ = function () { reloadFresh("hardReload"); };

          window.addEventListener("message", function (event) {
            var data = event && event.data;
            if (!data || typeof data !== "object") return;
            var type = data.type || data.kind;
            if (type === "NEXUS_BUILD_CHANGED" || type === "LOVABLE_BUILD_CHANGED" || type === "NEXUS_HARD_RELOAD_LATEST") {
              reloadFresh("iframeBuild");
            }
          });

          var swCleanup = Promise.resolve();
          if ("serviceWorker" in navigator) {
            swCleanup = navigator.serviceWorker
              .getRegistrations()
              .then(function (regs) {
                if (regs && regs.length) {
                  didCleanup = true;
                  return Promise.all(
                    regs.map(function (r) {
                      try { return r.unregister(); } catch (e) { return null; }
                    })
                  );
                }
              })
              .catch(function () { /* ignore */ });
          }

          var cacheCleanup = Promise.resolve();
          if ("caches" in window) {
            cacheCleanup = caches
              .keys()
              .then(function (names) {
                if (names && names.length) {
                  didCleanup = true;
                  return Promise.all(
                    names.map(function (n) {
                      try { return caches.delete(n); } catch (e) { return null; }
                    })
                  );
                }
              })
              .catch(function () { /* ignore */ });
          }

          Promise.all([swCleanup, cacheCleanup]).then(function () {
            // Re-register the new self-destruct SW with a cache-busting query.
            // The ?v= ensures the browser treats it as a brand-new SW URL and
            // actually fetches it from the network instead of using its cache.
            var activation = Promise.resolve();
            if ("serviceWorker" in navigator) {
              try {
                activation = navigator.serviceWorker
                  .register("/sw.js?v=" + (window.__BUILD_TIME__ || Date.now()))
                  .then(waitForActivation)
                  .catch(function () { /* ignore */ });
              } catch (e) { /* ignore */ }
            }

            activation.then(function () {
              if (didCleanup && !alreadyFresh) reloadFresh();
            });
          });
        } catch (e) {
          // Never block the app on cleanup failure.
          if (window.console && console.warn) {
            console.warn("[cache-killer] failed", e);
          }
        }
      })();
    </script>

    <!--
      Static fallback build badge. Visible only if React fails to mount
      (in which case the BuildVersionBadge React component never replaces
      it). When React mounts, it sets data-react-mounted="1" on <html>
      and CSS hides this element.
    -->
    <div id="static-build-fallback"
         style="position:fixed;bottom:6px;left:6px;z-index:2147483647;
                font:10px ui-monospace,Menlo,monospace;color:#9ca3af;
                background:rgba(15,23,42,0.7);border:1px solid rgba(148,163,184,0.25);
                border-radius:9999px;padding:3px 8px;backdrop-filter:blur(6px);
                pointer-events:none;">
      <span id="static-build-fallback-label">html · loading…</span>
    </div>
    <style>
      html[data-react-mounted="1"] #static-build-fallback { display: none; }
    </style>
    <script>
      (function () {
        try {
          var el = document.getElementById("static-build-fallback-label");
          if (el && window.__BUILD_TIME__) {
            el.textContent = "html · " + window.__BUILD_TIME__;
          }
        } catch (e) { /* ignore */ }
      })();
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
