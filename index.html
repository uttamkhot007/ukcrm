<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>NexusCRM - AI-Powered Business Management Platform</title>
    <meta name="description" content="Comprehensive AI-enabled CRM with Sales, Finance, HR, Technical, Marketing, and Employee Management modules. Streamline your business operations." />
    <meta name="author" content="NexusCRM" />

    <!-- Social preview (sitewide fallback; per-route tags come from react-helmet-async) -->
    <meta property="og:title" content="NexusCRM - AI-Powered Business Management Platform" />
    <meta property="og:description" content="AI-enabled CRM with Sales, Finance, HR, Technical, Marketing, and Employee Management modules in one multi-tenant platform." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="NexusCRM" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="NexusCRM - AI-Powered Business Management Platform" />
    <meta name="twitter:description" content="AI-enabled CRM with Sales, Finance, HR, Technical, Marketing, and Employee Management modules in one multi-tenant platform." />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "NexusCRM",
        "url": "/",
        "description": "AI-enabled multi-tenant business management platform covering Sales, Finance, HR, and operations."
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "NexusCRM",
        "url": "/"
      }
    </script>


    <!--
      Cache-Control: prevent the HTML shell from ever being cached.
      Ensures admin routes always fetch the latest JS bundle from the network.
    -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <!-- Build identity (also surfaced by BuildVersionBadge after React mounts). -->
    <meta name="build-time" content="__INDEX_HTML_BUILT__" />
    <meta name="build-commit" content="__INDEX_HTML_COMMIT__" />
    <meta name="release-id" content="__INDEX_HTML_RELEASE_ID__" />
    <meta name="release-revision" content="__INDEX_HTML_RELEASE_REVISION__" />
    <meta name="release-environment" content="__INDEX_HTML_ENVIRONMENT__" />
    <meta name="ui-schema-version" content="3" />
    <meta name="approved-design-id" content="__INDEX_HTML_APPROVED_DESIGN_ID__" />
    <meta name="approved-design-revision" content="__INDEX_HTML_APPROVED_DESIGN_REVISION__" />


    <script>
      (function () {
        try {
          var buildTime = document.querySelector('meta[name="build-time"]')?.getAttribute("content") || String(Date.now());
          window.__BUILD_TIME__ = buildTime;
          window.__NEXUS_RELEASE_ID__ = document.querySelector('meta[name="release-id"]')?.getAttribute("content") || null;
          window.__NEXUS_RELEASE_REVISION__ = Number(document.querySelector('meta[name="release-revision"]')?.getAttribute("content") || "0");

          // Reject an HTML shell below the highest approved design this browser
          // has already displayed. This runs before any application JavaScript.
          var designMeta = document.querySelector('meta[name="approved-design-revision"]');
          var htmlDesignRevision = Number(designMeta && designMeta.getAttribute("content") || "0");
          var storedDesign = null;
          try { storedDesign = JSON.parse(localStorage.getItem("nexus:approved-design") || "null"); } catch (e) {}
          if (storedDesign && Number(storedDesign.revision) > htmlDesignRevision) {
            document.documentElement.setAttribute("data-stale-design-blocked", "1");
            if ("caches" in window) caches.keys().then(function (names) {
              return Promise.all((names || []).map(function (name) { return caches.delete(name); }));
            }).finally(function () { window.location.reload(); });
            return;
          }

          // Manual "hard reload" helper: plain reload, no URL rewriting.
          // Adding ?fresh=/?build= params created a brand new cache entry for
          // every reload, which is what made old snapshots come back.
          window.__NEXUS_HARD_RELOAD_LATEST__ = function () {
            window.location.reload();
          };

          // No service worker is registered by this app. Any registration left
          // over from an older build is torn down here, along with the caches it
          // created. If this page itself was served by a stale worker, we reload
          // exactly once (guarded by a session flag) so the user can never keep
          // looking at an outdated view.
          var swPurgeFlag = "nexus:sw-purged";
          var controlledByStaleSw =
            "serviceWorker" in navigator && !!navigator.serviceWorker.controller;

          function reloadOnceAfterPurge() {
            try {
              if (sessionStorage.getItem(swPurgeFlag) === "1") return;
              sessionStorage.setItem(swPurgeFlag, "1");
            } catch (e) { return; }
            window.location.reload();
          }

          if ("serviceWorker" in navigator) {
            navigator.serviceWorker.getRegistrations().then(function (regs) {
              var had = (regs || []).length > 0;
              return Promise.all(
                (regs || []).map(function (r) {
                  return r.unregister().catch(function () {});
                })
              ).then(function () {
                if (had && controlledByStaleSw) reloadOnceAfterPurge();
              });
            }).catch(function () {});
          }
          if ("caches" in window) {
            caches.keys().then(function (names) {
              (names || []).forEach(function (n) {
                try { caches.delete(n); } catch (e) { /* ignore */ }
              });
            }).catch(function () {});
          }

        } catch (e) { /* never block app startup */ }
      })();
    </script>

    <meta name="theme-color" content="#6366f1" />

    <!-- Mobile Optimization -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="HandheldFriendly" content="true" />

    <meta property="og:title" content="NexusCRM - AI-Powered Business Management" />
    <meta property="og:description" content="Comprehensive AI-enabled CRM with Sales, Finance, HR, Technical, Marketing, and Employee Management modules." />
    <meta property="og:type" content="website" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@NexusCRM" />
    <style id="approved-theme-first-paint">
      html:not([data-theme-purged="1"]) body { visibility: hidden; }
      html, body {
        margin: 0;
        min-height: 100%;
        background: hsl(225 30% 96%);
        color: hsl(222 47% 11%);
        color-scheme: light;
      }
    </style>
    <script>
      // Theme persistence is fully disabled. Delete all theme-related browser
      // storage before the body can paint; React waits for the IndexedDB purge.
      (function () {
        var DEFAULT_THEME = { mode: 'light', brand: 'emerald', mood: 'cyber' };
        function isThemeKey(key) {
          if (!key || typeof key !== 'string') return false;
          var normalized = key.trim().toLowerCase();
          return normalized.indexOf('theme') !== -1 || normalized.indexOf('color-scheme') !== -1;
        }
        function purgeStorage(storage) {
          if (!storage) return;
          try {
            var doomed = [];
            for (var i = 0; i < storage.length; i++) {
              var key = storage.key(i);
              if (isThemeKey(key)) doomed.push(key);
            }
            doomed.forEach(function (key) { storage.removeItem(key); });
          } catch (e) {}
        }
        function purgeCookies() {
          try {
            document.cookie.split(';').forEach(function (part) {
              var name = (part.split('=')[0] || '').trim();
              if (!isThemeKey(name)) return;
              document.cookie = encodeURIComponent(name) + '=; path=/; max-age=0; SameSite=Lax' + (location.protocol === 'https:' ? '; Secure' : '');
              document.cookie = encodeURIComponent(name) + '=; max-age=0; SameSite=Lax' + (location.protocol === 'https:' ? '; Secure' : '');
            });
          } catch (e) {}
        }
        function purgeIndexedDb() {
          try {
            if (!('indexedDB' in window) || !indexedDB.databases) return;
            indexedDB.databases().then(function (dbs) {
              (dbs || []).forEach(function (db) {
                if (db && db.name && isThemeKey(db.name)) {
                  try { indexedDB.deleteDatabase(db.name); } catch (e) {}
                }
              });
            }).catch(function () {});
          } catch (e) {}
        }
        purgeStorage(localStorage);
        purgeStorage(sessionStorage);
        purgeCookies();
        purgeIndexedDb();
        var el = document.documentElement;
        var mode = DEFAULT_THEME.mode;
        var brand = DEFAULT_THEME.brand;
        var mood = DEFAULT_THEME.mood;

        el.classList.remove('light', 'dark');
        el.classList.add(mode);
        el.setAttribute('data-brand', brand);
        el.setAttribute('data-mood', mood);
        el.style.colorScheme = mode;

      })();
    </script>
  </head>


  <body>
    <!--
      The cache-killer (registers the self-destruct service worker, deletes
      old caches, then reloads ONCE if needed) lives in the <head> script
      above. Do not duplicate it here — running it twice caused a second
      hard reload that produced a brief blank page on every refresh.
    -->

    <!--
      Static fallback build badge. Visible only if React fails to mount
      (in which case the BuildVersionBadge React component never replaces
      it). When React mounts, it sets data-react-mounted="1" on <html>
      and CSS hides this element.
    -->
    <div id="static-build-fallback"
         style="position:fixed;bottom:6px;left:6px;z-index:2147483647;
                font:10px ui-monospace,Menlo,monospace;color:#9ca3af;
                background:rgba(15,23,42,0.7);border:1px solid rgba(148,163,184,0.25);
                border-radius:9999px;padding:3px 8px;backdrop-filter:blur(6px);
                pointer-events:none;">
      <span id="static-build-fallback-label">html · loading…</span>
    </div>
    <style>
      html[data-react-mounted="1"] #static-build-fallback { display: none; }
    </style>
    <script>
      (function () {
        try {
          var el = document.getElementById("static-build-fallback-label");
          if (el && window.__BUILD_TIME__) {
            el.textContent = "html · " + window.__BUILD_TIME__;
          }
        } catch (e) { /* ignore */ }
      })();
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
