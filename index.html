<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

    <meta name="description" content="Comprehensive AI-enabled CRM with Sales, Finance, HR, Technical, Marketing, and Employee Management modules. Streamline your business operations." />

      Cache-Control: prevent the HTML shell from ever being cached.
      Ensures admin routes always fetch the latest JS bundle from the network.
    -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <meta name="theme-color" content="#6366f1" />

    <!-- Mobile Optimization -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="HandheldFriendly" content="true" />

    <meta property="og:title" content="NexusCRM - AI-Powered Business Management" />
    <meta property="og:description" content="Comprehensive AI-enabled CRM with Sales, Finance, HR, Technical, Marketing, and Employee Management modules." />
    <meta property="og:type" content="website" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@NexusCRM" />
  </head>

  <body class="dark">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
