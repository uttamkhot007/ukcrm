<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>NexusCRM - AI-Powered Business Management Platform</title>
    <meta name="description" content="Comprehensive AI-enabled CRM with Sales, Finance, HR, Technical, Marketing, and Employee Management modules. Streamline your business operations." />
    <meta name="author" content="NexusCRM" />

    <!-- Social preview (sitewide fallback; per-route tags come from react-helmet-async) -->
    <meta property="og:title" content="NexusCRM - AI-Powered Business Management Platform" />
    <meta property="og:description" content="AI-enabled CRM with Sales, Finance, HR, Technical, Marketing, and Employee Management modules in one multi-tenant platform." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="NexusCRM" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="NexusCRM - AI-Powered Business Management Platform" />
    <meta name="twitter:description" content="AI-enabled CRM with Sales, Finance, HR, Technical, Marketing, and Employee Management modules in one multi-tenant platform." />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "NexusCRM",
        "url": "/",
        "description": "AI-enabled multi-tenant business management platform covering Sales, Finance, HR, and operations."
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "NexusCRM",
        "url": "/"
      }
    </script>


    <!--
      Cache-Control: prevent the HTML shell from ever being cached.
      Ensures admin routes always fetch the latest JS bundle from the network.
    -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <!-- Build identity (also surfaced by BuildVersionBadge after React mounts). -->
    <meta name="build-time" content="__INDEX_HTML_BUILT__" />
    <meta name="build-commit" content="__INDEX_HTML_COMMIT__" />


    <script>
      (function () {
        try {
          var buildTime = document.querySelector('meta[name="build-time"]')?.getAttribute("content") || String(Date.now());
          window.__BUILD_TIME__ = buildTime;

          // Manual "hard reload" helper: plain reload, no URL rewriting.
          // Adding ?fresh=/?build= params created a brand new cache entry for
          // every reload, which is what made old snapshots come back.
          window.__NEXUS_HARD_RELOAD_LATEST__ = function () {
            window.location.reload();
          };

          // No service worker is registered by this app. Any registration left
          // over from an older build is removed once, along with its caches.
          // We never reload here: reloading after cleanup fought with the
          // React-side unregister and bounced users onto stale snapshots.
          if ("serviceWorker" in navigator) {
            navigator.serviceWorker.getRegistrations().then(function (regs) {
              (regs || []).forEach(function (r) {
                try { r.unregister(); } catch (e) { /* ignore */ }
              });
            }).catch(function () {});
          }
          if ("caches" in window) {
            caches.keys().then(function (names) {
              (names || []).forEach(function (n) {
                try { caches.delete(n); } catch (e) { /* ignore */ }
              });
            }).catch(function () {});
          }
        } catch (e) { /* never block app startup */ }
      })();
    </script>

    <meta name="theme-color" content="#6366f1" />

    <!-- Mobile Optimization -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="HandheldFriendly" content="true" />

    <meta property="og:title" content="NexusCRM - AI-Powered Business Management" />
    <meta property="og:description" content="Comprehensive AI-enabled CRM with Sales, Finance, HR, Technical, Marketing, and Employee Management modules." />
    <meta property="og:type" content="website" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@NexusCRM" />
  </head>

  <body class="dark">
    <!--
      The cache-killer (registers the self-destruct service worker, deletes
      old caches, then reloads ONCE if needed) lives in the <head> script
      above. Do not duplicate it here — running it twice caused a second
      hard reload that produced a brief blank page on every refresh.
    -->

    <!--
      Static fallback build badge. Visible only if React fails to mount
      (in which case the BuildVersionBadge React component never replaces
      it). When React mounts, it sets data-react-mounted="1" on <html>
      and CSS hides this element.
    -->
    <div id="static-build-fallback"
         style="position:fixed;bottom:6px;left:6px;z-index:2147483647;
                font:10px ui-monospace,Menlo,monospace;color:#9ca3af;
                background:rgba(15,23,42,0.7);border:1px solid rgba(148,163,184,0.25);
                border-radius:9999px;padding:3px 8px;backdrop-filter:blur(6px);
                pointer-events:none;">
      <span id="static-build-fallback-label">html · loading…</span>
    </div>
    <style>
      html[data-react-mounted="1"] #static-build-fallback { display: none; }
    </style>
    <script>
      (function () {
        try {
          var el = document.getElementById("static-build-fallback-label");
          if (el && window.__BUILD_TIME__) {
            el.textContent = "html · " + window.__BUILD_TIME__;
          }
        } catch (e) { /* ignore */ }
      })();
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
